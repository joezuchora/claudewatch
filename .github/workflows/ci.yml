name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      # The same gate a contributor runs: typecheck, lint, test, build.
      #
      # Deliberately one step rather than six. The previous workflow ran each package's tests
      # in a separate process, which hid cross-file test contamination that made a whole-suite
      # `bun test` fail 128 of 341 tests. Running exactly what a contributor runs is what stops
      # local and CI from drifting apart again. See sdlc/001-quality-gate/.
      - name: Verify
        run: bun run verify
